# Flags for the web target only; every other target is unaffected.
# Emscripten side module for Godot's dlink web templates (single-threaded). For the
# threaded templates add "-C", "link-args=-pthread", "-C", "target-feature=+atomics".
# The -Z flags need nightly: `cargo +nightly build -Zbuild-std --target wasm32-unknown-emscripten`.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-args=-sSIDE_MODULE=2",
    "-C", "llvm-args=-enable-emscripten-cxx-exceptions=0",
    "-Z", "default-visibility=hidden",
    "-Z", "link-native-libraries=no",
    "-C", "panic=abort",
]

# Reproducible Windows DLL: mingw's linker otherwise stamps the link time into the PE header,
# so every rebuild of the committed binary would differ.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--no-insert-timestamp"]

# Android (arm64-v8a): 16 KB page alignment, required by Google Play for Android 15+. The
# linker itself comes from the NDK and is passed by sdk-godot/build.sh.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
